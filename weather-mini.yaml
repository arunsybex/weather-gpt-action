openapi: 3.1.0

info:
  title: Mini Weather API
  version: 1.0.0

servers:
  - url: https://api.weather.gov

paths:
  /points/{lat},{lon}:
    get:
      operationId: getPoint
      summary: Get forecast point
      parameters:
        - name: lat
          in: path
          required: true
          schema:
            type: number

        - name: lon
          in: path
          required: true
          schema:
            type: number

      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
